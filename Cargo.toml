[package]
name = "sokol-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
epoxy = "0.1.0"
gdk = { version = "^0", package = "gdk4" }
gio = "0.21.5"
gl = "0.14.0"
glib = "0.21.5"
gtk = { version = "0.11.2", package = "gtk4", features = ["v4_12"] }
libloading = "0.9.0"
rand = "0.9.2"
sokol = { version = "*", git = "https://github.com/floooh/sokol-rust.git" }
